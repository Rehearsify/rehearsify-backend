services:
  db:
    image: postgres:15-alpine
    container_name: rehearsify-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rehearsify_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rehearsify_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-rehearsify_db}'
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    container_name: rehearsify-backend
    ports:
      - '8000:8000'
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-rehearsify_pass}@db:5432/${POSTGRES_DB:-rehearsify_db}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
